<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>饥荒烹饪手册 · 食材三维 &amp; 配方速查</title>
<style>
  :root{
    --bg:#05070c;
    --bg2:#0a1120;
    --panel:#0b1424;
    --panel2:#101b2e;
    --line:#1a2940;
    --line2:#26394f;
    --ink:#e8f0ff;
    --muted:#93a8c6;
    --dim:#5f7391;
    --ember:#4d9bff;
    --ember2:#9cc9ff;
    --hunger:#ffbf5e;
    --health:#ff6f7d;
    --sanity:#5fb2ff;
    --ok:#7dbb6a;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 520px at 18% -12%, rgba(77,155,255,.13), transparent 62%),
      radial-gradient(900px 480px at 92% 8%, rgba(99,180,255,.08), transparent 60%),
      linear-gradient(180deg,#0a1120 0%, #05070c 46%, #04060a 100%);
    color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>");
    mix-blend-mode:overlay;
  }
  .wrap{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:26px 22px 40px}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:14px}
  .crest{
    width:46px;height:46px;flex:0 0 46px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #cfe4ff, #4d9bff 42%, #1b4a86 74%, #0a2342);
    box-shadow:0 0 0 1px #17335c, 0 0 26px rgba(77,155,255,.34), inset -3px -5px 10px rgba(0,0,0,.45);
    position:relative;
  }
  .crest::after{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 50% 70%, rgba(255,190,120,.9), transparent 68%);filter:blur(2px)}
  h1{font-family:var(--serif);font-size:27px;letter-spacing:.09em;margin:0;font-weight:700;
     background:linear-gradient(180deg,#ffffff,#b9d2f2 70%,#7c96b8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:5px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.16em;display:flex;align-items:center;gap:9px}
  .tag{font-size:10.5px;letter-spacing:.14em;padding:2px 7px;border:1px solid var(--line2);border-radius:999px;color:var(--ember2);background:rgba(77,155,255,.07)}

  .searchwrap{position:relative;flex:1 1 340px;max-width:430px}
  .searchwrap input{
    width:100%;padding:13px 44px 13px 42px;border-radius:12px;border:1px solid var(--line2);
    background:linear-gradient(180deg,#101a2b,#08111d);color:var(--ink);font-size:14px;font-family:var(--sans);
    outline:none;transition:.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 10px 24px rgba(0,0,0,.35);
  }
  .searchwrap input::placeholder{color:var(--dim)}
  .searchwrap input:focus{border-color:#2f5d96;box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 3px rgba(77,155,255,.12)}
  .searchwrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--dim)}
  .searchwrap kbd{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font:11px/1 var(--sans);color:var(--dim);border:1px solid var(--line2);border-bottom-width:2px;
    border-radius:5px;padding:4px 6px;background:#091120;
  }

  /* ---------- meta strip ---------- */
  .meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:13px 2px 16px;font-size:12px;color:var(--dim);letter-spacing:.04em}
  .meta b{color:var(--muted);font-weight:600}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--line2);display:inline-block}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:minmax(400px,.92fr) 1.08fr;gap:18px;align-items:stretch}
  @media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr)} }
  .panel{
    background:linear-gradient(180deg,rgba(13,24,41,.94),rgba(7,13,23,.94));
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.035);
    display:flex;flex-direction:column;min-width:0;
    height:calc(100vh - 252px);min-height:560px;max-height:820px;
  }
  @media (max-width:1040px){ .panel{height:auto;max-height:none;min-height:0} }
  @media (max-width:720px){
    .wrap{padding:18px 12px 34px}
    .thead,.irow{padding-left:12px;padding-right:12px;gap:6px}
    .stat{gap:5px}
    .stat .num{min-width:29px;font-size:11.5px}
    .iname .cat{display:none}
    .searchwrap{max-width:none}
    .chart{gap:24px;padding-left:2px}
    .hero{padding:14px 14px 8px}
    h1{font-size:23px}
  }
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .phead h2{font-family:var(--serif);font-size:16px;margin:0;letter-spacing:.08em;font-weight:600;display:flex;align-items:baseline;gap:9px}
  .phead h2 small{font-family:var(--sans);font-size:11.5px;color:var(--dim);letter-spacing:.06em;font-weight:400}

  .sorts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sbtn{
    font:12px/1 var(--sans);letter-spacing:.05em;color:var(--muted);background:#0e1828;
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.16s;
    display:flex;align-items:center;gap:5px;
  }
  .sbtn:hover{color:var(--ink);border-color:var(--line2);background:#101a2b}
  .sbtn[aria-pressed="true"]{color:#1a1108;background:linear-gradient(180deg,var(--ember2),var(--ember));border-color:#7dbaff;font-weight:600;box-shadow:0 4px 14px rgba(77,155,255,.28)}
  .sbtn .k{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.85}
  .dirbtn{min-width:74px;justify-content:center;font-variant-numeric:tabular-nums}

  /* ---------- ingredient table ---------- */
  .thead,.irow{display:grid;grid-template-columns:minmax(96px,1.18fr) 1fr 1fr 1fr;gap:8px;align-items:center}
  .thead{padding:9px 16px;font-size:11px;letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
  .thead span:first-child{padding-left:2px}
  .thead .th{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;transition:.15s;padding:2px 0}
  .thead .th:hover{color:var(--ink)}
  .thead .th.on{color:var(--ember2)}
  .thead .th .ar{font-size:9px;opacity:.75}
  .ilist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .ilist::-webkit-scrollbar{width:8px}
  .ilist::-webkit-scrollbar-thumb{background:#1d314b;border-radius:9px}
  .ilist::-webkit-scrollbar-track{background:transparent}

  .irow{
    width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;
    border-bottom:1px solid rgba(53,42,34,.55);padding:9px 16px;cursor:pointer;
    transition:background .15s, box-shadow .15s;
  }
  .irow:hover{background:rgba(77,155,255,.055)}
  .irow[aria-selected="true"]{background:linear-gradient(90deg,rgba(77,155,255,.16),rgba(77,155,255,.03));box-shadow:inset 3px 0 0 var(--ember)}
  .iname{display:flex;align-items:center;gap:8px;min-width:0}
  .iname .nm{font-size:13.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iname .cat{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 4px;flex:0 0 auto}
  .irow[aria-selected="true"] .iname .cat{color:var(--ember2);border-color:#2f5d96}

  .stat{display:flex;align-items:center;gap:7px;min-width:0}
  .stat .num{font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:38px;color:#dfe9fb}
  .stat .num.neg{color:#ff8f9a}
  .stat .num.zero{color:var(--dim)}
  .bar{
    position:relative;flex:1;height:9px;border-radius:2px;background:rgba(255,255,255,.045);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden;min-width:18px;
  }
  .bar i{
    display:block;position:relative;height:100%;border-radius:2px;
    transform-origin:left center;animation:grow .5s cubic-bezier(.2,.8,.3,1) both;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.22);
  }
  .bar i::after{
    content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);opacity:.5;border-radius:2px;
  }
  .bar.h i{background:linear-gradient(180deg,#ffd98f,var(--hunger) 55%,#a86a12)}
  .bar.p i{background:linear-gradient(180deg,#ff9aa2,var(--health) 55%,#9c2f36)}
  .bar.s i{background:linear-gradient(180deg,#a9d3ff,var(--sanity) 55%,#2b5f9c)}
  .bar i.negfill{
    background:repeating-linear-gradient(45deg,rgba(226,87,76,.75) 0 3px,rgba(120,45,38,.55) 3px 6px);
    box-shadow:none;
  }
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* ---------- selected ingredient hero ---------- */
  .hero{padding:15px 18px 10px;border-bottom:1px solid var(--line);display:none}
  .hero.show{display:block;animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hero h3{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:.05em}
  .hero .close{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;font-size:11px;padding:4px 8px;cursor:pointer;transition:.15s}
  .hero .close:hover{color:var(--ink);border-color:var(--line2);background:#101a2b}
  .hero p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
  .chart{position:relative;display:flex;align-items:flex-end;gap:44px;height:150px;margin:4px 0 0;padding:0 6px 0 12px}
  .chart::after{content:"";position:absolute;left:6px;right:6px;bottom:82px;height:1px;background:linear-gradient(90deg,rgba(74,56,43,0) 0,#4a382b 10%,#4a382b 88%,rgba(74,56,43,0) 100%)}
  .chart .col{position:relative;width:60px;height:100%}
  .chart .plot{position:absolute;left:0;right:0;top:4px;bottom:44px;display:flex;flex-direction:column}
  .chart .pos{flex:0 0 62%;display:flex;align-items:flex-end;justify-content:center}
  .chart .negz{flex:1;display:flex;align-items:flex-start;justify-content:center}
  .chart .fill{
    position:relative;width:24px;min-height:3px;border-radius:3px 3px 1px 1px;
    box-shadow:7px 0 0 rgba(0,0,0,.36), inset 0 2px 0 rgba(255,255,255,.42), inset -2px 0 0 rgba(0,0,0,.2);
    animation:rise .5s cubic-bezier(.2,.85,.3,1) both;transform-origin:bottom center;
  }
  @keyframes rise{from{transform:scaleY(.03)}to{transform:scaleY(1)}}
  .chart .fill.h{background:linear-gradient(180deg,#ffd79a,var(--hunger) 55%,#a1600f)}
  .chart .fill.p{background:linear-gradient(180deg,#ff9aa2,var(--health) 55%,#82261f)}
  .chart .fill.s{background:linear-gradient(180deg,#b8d9ff,var(--sanity) 55%,#534199)}
  .chart .fill.neg{
    background:repeating-linear-gradient(45deg,rgba(226,87,76,.62) 0 5px,rgba(96,38,32,.55) 5px 10px);
    box-shadow:7px 0 0 rgba(0,0,0,.32);border-radius:1px 1px 3px 3px;transform-origin:top center;
  }
  .chart .val{position:absolute;left:-6px;right:-6px;bottom:25px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
  .chart .val.neg{color:#ff8f9a}
  .chart .val.zero{color:var(--dim)}
  .chart .cap{position:absolute;left:-6px;right:-6px;bottom:7px;text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.1em;line-height:1}

  /* ---------- recipes ---------- */
  .rlist{flex:1;min-height:0;overflow-y:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
  .rlist::-webkit-scrollbar{width:8px}
  .rlist::-webkit-scrollbar-thumb{background:#1d314b;border-radius:9px}
  @media (max-width:620px){ .rlist{grid-template-columns:1fr} }

  .dish{
    position:relative;background:linear-gradient(180deg,#101a2b,#0c1626);
    border:1px solid var(--line);border-radius:12px;padding:12px 13px 11px;
    transition:transform .18s, border-color .18s, box-shadow .18s;
    animation:fade .3s ease both;
  }
  .dish:hover{transform:translateY(-2px);border-color:#274669;box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .dish .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dish h3{margin:0;font-family:var(--serif);font-size:15.5px;letter-spacing:.04em;font-weight:600}
  .prio{font-size:10px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
  .dstats{display:flex;gap:10px;margin:9px 0 8px}
  .dstat{flex:1;min-width:0}
  .dstat .lab{font-size:9.5px;letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between;gap:4px}
  .dstat .lab b{font-weight:600;font-variant-numeric:tabular-nums;color:#dfe9fb;font-size:11.5px}
  .dstat .track{height:6px;border-radius:3px;background:rgba(255,255,255,.075);margin-top:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
  .dstat .track i{display:block;position:relative;height:100%;border-radius:2px;animation:grow .5s cubic-bezier(.2,.8,.3,1) both}
  .need{font-size:11.5px;color:var(--muted);margin:0 0 9px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:10.5px;color:#a9bed9;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:2.5px 6px;cursor:pointer;transition:.14s}
  .chip:hover{color:var(--ink);border-color:var(--line2);background:rgba(77,155,255,.12)}
  .chip.on{color:#21160d;background:linear-gradient(180deg,var(--ember2),var(--ember));border-color:#7dbaff;font-weight:600}
  .chip.empty{opacity:.6;cursor:default}

  .empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.8;grid-column:1/-1}
  .empty b{color:var(--muted)}
  .resetwrap{grid-column:1/-1;padding:6px 0 2px;display:flex;justify-content:center}
  .resetbtn{
    font:12px/1 var(--sans);letter-spacing:.06em;color:var(--muted);background:rgba(255,255,255,.03);
    border:1px dashed var(--line2);border-radius:9px;padding:10px 16px;cursor:pointer;transition:.16s
  }
  .resetbtn:hover{color:var(--ink);border-style:solid;background:rgba(77,155,255,.1);border-color:#2f5d96}

  footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.9;letter-spacing:.02em}
  footer b{color:var(--muted);font-weight:600}

  ::selection{background:rgba(77,155,255,.3)}
  /* ---------- language switch ---------- */
  .headright{display:flex;align-items:center;gap:10px;flex:1 1 360px;justify-content:flex-end;max-width:560px}
  .langbtn{display:flex;gap:2px;padding:3px;background:#0e1828;border:1px solid var(--line);border-radius:9px;cursor:pointer;font:11px/1 var(--sans);letter-spacing:.06em;flex:0 0 auto;transition:.16s}
  .langbtn span{padding:6px 8px;border-radius:6px;color:var(--dim);transition:.15s}
  .langbtn span.on{background:linear-gradient(180deg,var(--ember2),var(--ember));color:#1a1108;font-weight:700}
  .langbtn:hover span:not(.on){color:var(--ink)}
  .sbtn span{white-space:nowrap}
  /* ---------- farming ---------- */
  .farm{margin-top:18px;height:auto;max-height:none;min-height:0}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px;padding:14px}
  .fcard{
    background:linear-gradient(180deg,#101a2b,#0c1626);border:1px solid var(--line);border-radius:12px;
    padding:13px;transition:transform .18s,border-color .18s,box-shadow .18s;animation:fade .3s ease both;
  }
  .fcard:hover{transform:translateY(-2px);border-color:#274669;box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .fseeds{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .seedunit{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;flex:0 0 76px}
  .seedunit .sicon{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.12),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 14px rgba(0,0,0,.28);
  }
  .seedunit .sicon svg{width:31px;height:31px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .seedunit .sicon img{width:42px;height:42px;object-fit:contain;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));user-select:none}
  .seedunit .cnt{font-size:11.5px;color:var(--ember2);font-variant-numeric:tabular-nums;letter-spacing:.03em;font-weight:600}
  .seedunit .cn{font-size:10.5px;color:#ddcdb8;white-space:normal;text-align:center;line-height:1.25;max-width:76px;word-break:break-word}
  .seedunit .sn{font-size:9.5px;color:var(--dim);white-space:normal;text-align:center;line-height:1.2;max-width:76px;word-break:break-word}
  .fmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;color:var(--dim)}
  .fmeta .pill{border:1px solid var(--line);border-radius:5px;padding:2.5px 6px;color:var(--muted);letter-spacing:.02em}
  .fmeta .pill.ok{color:#a2cf8b;border-color:#3d5334;background:rgba(125,187,106,.09)}
  .fmeta .pill.fert{color:#e9b271;border-color:#5a3f22;background:rgba(77,155,255,.09)}
  .ntwrap{border-top:1px solid var(--line);padding:14px 14px 16px}
  .nthead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .nthead span{font-family:var(--serif);font-size:14px;letter-spacing:.06em}
  .nthead small{font-size:11px;color:var(--dim)}
  .farmtable{overflow-x:auto}
  table.nt{width:100%;max-width:860px;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  .ntnote{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.7;max-width:860px}

  /* ---------- fishing ---------- */
  .ocean{margin-top:18px;height:auto;max-height:none;min-height:0}
  .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}
  @media (max-width:880px){ .zones{grid-template-columns:1fr} }
  .zone{background:linear-gradient(180deg,#101a2b,#0b1524);border:1px solid var(--line);border-radius:12px;padding:13px}
  .zone h3{margin:0;font-family:var(--serif);font-size:14.5px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
  .zone h3 .zd{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
  .zone p.zn{margin:6px 0 11px;font-size:10.5px;color:var(--dim);line-height:1.55}
  .fishlist{display:flex;flex-direction:column;gap:6px}
  .fish{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
  .fish .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fish .badge{font-size:9.5px;padding:1.5px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
  .fish .badge.season{color:#9cc9ff;border-color:#274669;background:rgba(77,155,255,.1)}
  .fish .badge.veg{color:#9ed6a4;border-color:#2f4f38;background:rgba(125,187,106,.09)}
  .fish .badge.meat{color:#ffb3ba;border-color:#593039;background:rgba(255,111,125,.09)}
  .fish.rare{border-color:#4a3c22;background:rgba(255,191,94,.07)}
  .special{margin:0 14px 2px;font-size:11px;color:var(--dim);line-height:1.6}
  .baitbox{border-top:1px solid var(--line);padding:14px}

function renderOcean(){
  const s = L();
  $('#lbFish').textContent = s.fish;
  $('#fishHint').textContent = s.fishHint;
  $('#baitTitle').textContent = s.baitTitle;

  $('#zones').innerHTML = OCEAN.map(z => `
    <div class="zone">
      <h3><span class="zd" style="background:${z.c}"></span>${lang === 'zh' ? z.zh : z.en}</h3>
      <p class="zn">${s.zoneNote[z.key]}</p>
      <div class="fishlist">${z.fish.map(f => `
        <div class="fish ${f.season ? 'rare' : ''}">
          <span class="fn" title="${f.en || f.zh}">${lang === 'zh' ? f.zh : (f.en || f.zh)}</span>
          ${f.diet ? `<span class="badge ${f.diet}">${s.diet[f.diet]}</span>` : ''}
          ${f.season ? `<span class="badge season">${s.seasons[f.season]}</span>` : ''}
        </div>`).join('')}</div>
    </div>`).join('') +
    `<p class="special" style="grid-column:1/-1">${s.special}</p>`;

  $('#baitGrid').innerHTML = s.bait.map(([t, d]) => `<div class="bait"><b>${t}</b>${d}</div>`).join('');

function seedSvg(k){
  if(SEED_IMG[k]){
    return `<img src="${SEED_IMG[k]}" alt="${lang === 'zh' ? CROPS[k].zh : CROPS[k].en}" draggable="false">`;
  }
  const col = CROPS[k].c;
  return `<svg viewBox="0 0 32 32" aria-hidden="true">
    <defs><radialGradient id="sg-${k}" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset="38%" stop-color="${col}"/>
      <stop offset="100%" stop-color="#241610" stop-opacity=".95"/>
    </radialGradient></defs>
    <path d="M16 29c-4.6 0-8.4-4.6-8.4-10.4C7.6 11.7 11.3 6 16 6s8.4 5.7 8.4 12.6C24.4 24.4 20.6 29 16 29z" fill="url(#sg-${k})" stroke="rgba(0,0,0,.32)"/>
    <path d="M16 7.5c1.4-3 4-4.6 6.8-4.5-.5 3.1-2.8 5.4-6.4 6z" fill="#6f9d4c"/>
    <path d="M15.4 8.8c-2.6-1.4-4.2-3.6-4.4-6.1 3 .3 5.1 2.4 5.6 5.5z" fill="#8ab968" opacity=".9"/>
  </svg>`;
}

/* ================= state ================= */
const state = { stat:'hunger', dir:'desc', q:'', sel:null, dstat:'hunger', ddir:'desc', fseason:'all' };
const IMAX = { h:37.5, p:20, s:15 };
const DMAX = { h:150,  p:100, s:33 };
const KEY = { hunger:'h', health:'p', sanity:'s' };
const $ = (s) => document.querySelector(s);
const fmt = (v) => (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '');

const nm = (item) => lang === 'zh' ? item.n : item.e;
const ingName = (zhName) => { const it = ING.find(x => x.n === zhName); return it ? nm(it) : zhName; };
const catName = (key) => CAT[key] ? CAT[key][lang] : key;

/* ================= static text ================= */
function applyStatic(){
  const s = L();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = s.doc;
  $('#hTitle').textContent = s.title;
  $('#hSub').textContent = s.sub;
  $('#hTag').textContent = s.tag;
  $('#q').placeholder = s.ph;
  document.body.classList.toggle('en', lang === 'en');
  $('#lbIng').textContent = s.ing;
  $('#uIng').textContent = s.uIng;
  $('#uDish').textContent = s.uDish;
  $('#mHint').textContent = s.hint;
  $('#thName').textContent = s.ing;
  document.querySelectorAll('[data-lab]').forEach(el => { el.textContent = LAB(el.dataset.lab); });
  $('#foot').innerHTML = s.foot;
  document.querySelectorAll('#langBtn [data-lang]').forEach(el => {
    el.classList.toggle('on', el.dataset.lang === lang);
  });
  document.querySelectorAll('.sorts .sbtn[data-stat]').forEach(b => { b.lastChild.textContent = LAB(b.dataset.stat); });
}

/* ================= sort controls ================= */
function renderSorts(){
  const opts = ['hunger','health','sanity'].map(k =>
    `<button class="sbtn" data-role="istat" data-stat="${k}" aria-pressed="${state.stat===k}">
       <i class="k" style="background:var(--${k})"></i><span>${LAB(k)}</span></button>`).join('') +
    `<button class="sbtn dirbtn" data-role="idir">${state.dir==='desc'?L().desc:L().asc}</button>`;
  $('#ingSorts').innerHTML = opts;

  const dopts = ['hunger','health','sanity'].map(k =>
    `<button class="sbtn" data-role="dstat" data-stat="${k}" aria-pressed="${state.dstat===k}">
       <i class="k" style="background:var(--${k})"></i><span>${LAB(k)}</span></button>`).join('') +
    `<button class="sbtn dirbtn" data-role="ddir">${state.ddir==='desc'?L().desc:L().asc}</button>`;
  $('#dishSorts').innerHTML = dopts;

  document.querySelectorAll('.thead .th').forEach(th => {
    const on = th.dataset.stat === state.stat;
    th.classList.toggle('on', on);
    th.querySelector('.ar').textContent = on ? (state.dir === 'desc' ? '▼' : '▲') : '';
  });
}

/* ================= ingredients ================= */
function ingMatches(i){
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  if(i.n.toLowerCase().includes(q) || i.e.toLowerCase().includes(q) || catName(i.cat).toLowerCase().includes(q)) return true;
  return DISH.some(d => d.uses.includes(i.n) && (d.n.toLowerCase().includes(q) || d.e.toLowerCase().includes(q)));
}

function renderIng(){
  const list = ING.filter(ingMatches);
  const k = KEY[state.stat];
  list.sort((a,b) => state.dir === 'desc' ? (b[k]||0) - (a[k]||0) : (a[k]||0) - (b[k]||0));

  $('#ingHint').textContent = L().summary(list.length, LAB(state.stat), state.dir);
  const box = $('#ilist');
  if(!list.length){
    box.innerHTML = `<div class="empty">${L().emptyIng}</div>`;
    return;
  }
  box.innerHTML = list.map(i => {
    const sel = state.sel === i.n;
    const cell = (val, cls) => {
      const w = Math.max(0, Math.min(1, Math.abs(val) / IMAX[cls]));
      const numCls = val < 0 ? 'neg' : (val === 0 ? 'zero' : '');
      return `<div class="stat">
        <span class="num ${numCls}">${val>0?'+':''}${fmt(val)}</span>
        <span class="bar ${cls}"><i class="${val<0?'negfill':''}" style="width:${(w*100).toFixed(1)}%;animation-delay:${(Math.random()*0.08).toFixed(2)}s"></i></span>
      </div>`;
    };
    return `<button class="irow" data-name="${i.n}" aria-selected="${sel}">
      <div class="iname"><span class="nm">${nm(i)}</span><span class="cat">${catName(i.cat)}</span></div>
      ${cell(i.h,'h')}${cell(i.p,'p')}${cell(i.s,'s')}
    </button>`;
  }).join('');
}

/* ================= dishes ================= */
function dishMatches(d){
  if(state.sel && !d.uses.includes(state.sel)) return false;
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  return d.n.toLowerCase().includes(q) || d.e.toLowerCase().includes(q)
      || d.need.toLowerCase().includes(q) || d.needE.toLowerCase().includes(q)
      || d.uses.some(u => u.toLowerCase().includes(q) || ingName(u).toLowerCase().includes(q));
}

function renderDish(){
  const list = DISH.filter(dishMatches).sort((a,b) => {
    const k = KEY[state.dstat];
    return state.ddir === 'desc' ? b[k] - a[k] : a[k] - b[k];
  });

  const selName = state.sel ? ingName(state.sel) : '';
  $('#dishTitle').innerHTML = `${L().dish} <small>${L().dishTitle(selName, state.q, list.length)}</small>`;

  const box = $('#rlist');
  if(!list.length){
    box.innerHTML = `<div class="empty">${L().emptyDish}</div>` +
      ((state.sel || state.q) ? `<div class="resetwrap"><button class="resetbtn" data-reset="1">${L().showAll(DISH.length)}</button></div>` : '');
  } else {
    box.innerHTML = list.map(d => {
      const st = [['hunger',d.h],['health',d.p],['sanity',d.s]].map(([stat,v]) => {
        const cls = stat === 'hunger' ? 'h' : stat === 'health' ? 'p' : 's';
        const w = Math.max(0.02, Math.min(1, Math.abs(v) / DMAX[cls]));
        const col = v < 0 ? 'var(--health)' : `var(--${stat})`;
        return `<div class="dstat">
          <div class="lab"><span>${LAB(stat)}</span><b>${v>0?'+':''}${fmt(v)}</b></div>
          <div class="track"><i style="width:${(w*100).toFixed(1)}%;background:${col};opacity:${v<0?.6:1}"></i></div>
        </div>`;
      }).join('');
      const chips = d.uses.map(u => `<span class="chip ${state.sel===u?'on':''}" data-ing="${u}">${ingName(u)}</span>`).join('');
      return `<article class="dish">
        <div class="row1"><h3>${nm(d)}</h3><span class="prio">${L().priority} ${d.prio}</span></div>
        <div class="dstats">${st}</div>
        <p class="need">${lang === 'zh' ? d.need : d.needE}</p>
        <div class="chips">${chips}</div>
      </article>`;
    }).join('') + ((state.sel || state.q)
      ? `<div class="resetwrap"><button class="resetbtn" data-reset="1">${L().showAll(DISH.length)}</button></div>`
      : '');
  }
  renderHero();
  applyStatic();
}

/* ================= hero ================= */
function renderHero(){
  const hero = $('#hero');
  const i = ING.find(x => x.n === state.sel);
  if(!i){ hero.classList.remove('show'); hero.innerHTML = ''; return; }
  hero.classList.add('show');

  const cols = ['hunger','health','sanity'].map(stat => {
    const v = i[KEY[stat]];
    const cls = stat === 'hunger' ? 'h' : stat === 'health' ? 'p' : 's';
    const pct = Math.max(3, Math.min(100, Math.abs(v) / IMAX[cls] * 100));
    const vcls = v < 0 ? 'neg' : (v === 0 ? 'zero' : '');
    return `<div class="col">
      <div class="plot">
        <div class="pos">${v>0 ? `<div class="fill ${cls}" style="height:${pct}%"></div>` : ''}</div>
        <div class="negz">${v<0 ? `<div class="fill ${cls} neg" style="height:${pct}%"></div>` : ''}</div>
      </div>
      <div class="val ${vcls}">${v>0?'+':''}${fmt(v)}</div>
      <div class="cap">${LAB(stat)}</div>
    </div>`;
  }).join('');

  const meta = [lang === 'zh' ? i.w : i.we, (lang === 'zh' ? '腐坏 ' : 'Spoils in ') + (lang === 'zh' ? i.life : i.lifeE)]
    .concat(i.note ? [lang === 'zh' ? i.note : i.noteE] : []).join(' · ');

  hero.innerHTML = `<div class="hero-top">
      <h3>${nm(i)} <span class="cat" style="font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px;vertical-align:2px">${catName(i.cat)}</span></h3>
      <button class="close" id="unsel">${L().cancel}</button>
    </div>
    <p>${meta}</p>
    <div class="chart">${cols}</div>`;
}

/* ================= farming render ================= */
function renderFarm(){
  const s = L();
  $('#lbFarm').textContent = s.farm;
  $('#farmHint').textContent = s.farmHint;
  $('#ntTitle').textContent = s.ntTitle;
  $('#ntHint').textContent = s.ntHint;
  $('#ntNote').textContent = s.swap;

  const seasons = ['spring','summer','autumn','winter'];
  $('#farmSorts').innerHTML =
    `<button class="sbtn" data-role="season" data-season="all" aria-pressed="${state.fseason==='all'}">${s.seasonAll}</button>` +
    seasons.map(k => `<button class="sbtn" data-role="season" data-season="${k}" aria-pressed="${state.fseason===k}">${s.seasons[k]}</button>`).join('');

  const list = FARM.filter(c => state.fseason === 'all' || c.mix.every(([k]) => CROPS[k].seasons.includes(state.fseason)));

  $('#farmGrid').innerHTML = list.length ? list.map(c => {
    const tiles = c.mix.reduce((a, [, n]) => a + n, 0);
    const common = c.mix.map(([k]) => CROPS[k].seasons).reduce((acc, arr) => acc.filter(x => arr.includes(x)));
    const seasonTxt = common.length ? common.map(k => s.seasons[k]).join(' / ') : '—';
    const seeds = c.mix.map(([k, n]) => `<div class="seedunit">
        <div class="sicon">${seedSvg(k)}</div>
        <div class="cnt">×${n}</div>
        <div class="cn">${lang === 'zh' ? CROPS[k].zh : CROPS[k].en + ' Seeds'}</div>
        ${lang === 'zh' ? `<div class="sn">${SEED_NAME[k]}</div>` : ''}
      </div>`).join('');
    return `<article class="fcard">
      <div class="fseeds">${seeds}</div>
      <div class="fmeta">
        <span class="pill">${s.tiles(tiles)}</span>
        <span class="pill">${seasonTxt}</span>
        <span class="pill ${c.safe ? 'ok' : 'fert'}">${c.safe ? s.safe : s.fert}</span>
      </div>
    </article>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">${lang === 'zh' ? '这个季节没有免施肥的配比，换季或者补一次肥吧。' : 'No fertilizer-free combo this season — change season or fertilize once.'}</div>`;

  const rows = Object.keys(CROPS).map(k => {
    const c = CROPS[k];
    const cell = (v) => `<td class="${v < 0 ? 'neg' : 'pos'}">${v > 0 ? '+' : ''}${v}</td>`;
    return `<tr>
      <td><span class="dotc" style="background:${c.c}"></span>${lang === 'zh' ? c.zh : c.en}</td>
      <td>${c.seasons.map(x => s.seasons[x]).join(' · ')}</td>
      ${cell(c.n[0])}${cell(c.n[1])}${cell(c.n[2])}
      <td>${s.water[c.water]}</td>
    </tr>`;
  }).join('');

  $('#ntTable').innerHTML = `<thead><tr>
      <th>${s.ntCrop}</th><th>${s.ntSeason}</th>
      <th>${s.nFormula}</th><th>${s.nCompost}</th><th>${s.nManure}</th><th>${s.ntWater}</th>
    </tr></thead><tbody>${rows}</tbody>`;
}

/* ================= events ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-role],[data-name],[data-ing],#unsel,.thead .th,[data-reset],#langBtn');
  if(!t) return;

  if(t.id === 'langBtn'){
    lang = lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem(LANG_KEY, lang);
    renderSorts(); renderIng(); renderDish(); renderFarm(); renderOcean(); applyStatic();
    return;
  }
  if(t.dataset.role === 'season'){ state.fseason = t.dataset.season; renderFarm(); return; }
  if(t.dataset.reset){ state.sel = null; state.q = ''; $('#q').value = ''; renderIng(); renderDish(); return; }
  if(t.id === 'unsel'){ state.sel = null; renderIng(); renderDish(); return; }

  if(t.classList.contains('th') || t.dataset.role === 'istat'){
    const s = t.dataset.stat;
    if(state.stat === s) state.dir = state.dir === 'desc' ? 'asc' : 'desc';
    else { state.stat = s; state.dir = 'desc'; }
    renderSorts(); renderIng(); return;
  }
  if(t.dataset.role === 'idir'){ state.dir = state.dir === 'desc' ? 'asc' : 'desc'; renderSorts(); renderIng(); return; }
  if(t.dataset.role === 'dstat'){
    const s = t.dataset.stat;
    if(state.dstat === s) state.ddir = state.ddir === 'desc' ? 'asc' : 'desc';
    else { state.dstat = s; state.ddir = 'desc'; }
    renderSorts(); renderDish(); return;
  }
  if(t.dataset.role === 'ddir'){ state.ddir = state.ddir === 'desc' ? 'asc' : 'desc'; renderSorts(); renderDish(); return; }

  if(t.dataset.name){
    state.sel = state.sel === t.dataset.name ? null : t.dataset.name;
    renderIng(); renderDish();
    return;
  }
  if(t.dataset.ing){
    state.sel = state.sel === t.dataset.ing ? null : t.dataset.ing;
    renderIng(); renderDish();
  }
});

$('#q').addEventListener('input', (e) => {
  state.q = e.target.value.trim();
  renderIng(); renderDish();
});

document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key === 'Escape'){ state.q = ''; $('#q').value = ''; state.sel = null; renderIng(); renderDish(); $('#q').blur(); }
});

/* ================= boot ================= */
(function init(){
  const qp = new URLSearchParams(location.search);
  if(qp.get('lang') === 'en'){ lang = 'en'; }
  if(qp.get('lang') === 'zh'){ lang = 'zh'; }
  const pre = qp.get('ing');
  if(pre && ING.some(i => i.n === pre)) state.sel = pre;
})();
$('#statIng').textContent = ING.length;
$('#statDish').textContent = DISH.length;
applyStatic(); renderSorts(); renderIng(); renderDish(); renderFarm(); renderOcean();
</script>
</body>
</html>
